
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

/* ===================== TIMER CSS ===================== */

/* ===================== ROOT ===================== */
:root {
  --primary: #444;
  --primaryLight: #777;
  --primaryDark: #222;
  --secondary: #888;
  --secondaryLight: #aaa;
}

/* ===================== BASE ===================== */
html, body {
    width:100%;
    height:100%;
    overflow:hidden;
}

body {
    margin:0;
    background:#000;
    color:#fff;
    font-family:'Arial Black', sans-serif;
    height:100vh;
}

/* ===================== HEADER ===================== */
#schoolHeader {
    display:grid;
    grid-template-columns: auto 1fr auto;
    align-items:center;
    padding:18px 40px;
    height:175px;
    position:relative;
    overflow:hidden;
}

/* watermark */
#schoolHeader::before {
    content:"STRENGTH  -  SPEED  -  AGILITY  -  POWER  -  EXPLOSIVENESS";
    position:absolute;
    top:50%;
    left:0;
    transform:translateY(-50%);
    white-space:nowrap;
    font-size:120px;
    font-weight:900;
    letter-spacing:8px;
    color:rgba(255,255,255,0.06);
    animation:scrollWatermark 25s linear infinite;
    z-index:0;
}

/* REMOVE shimmer */
#schoolHeader::after {
    display:none;
}

@keyframes scrollWatermark {
    0% { transform:translateX(100%) translateY(-50%); }
    100% { transform:translateX(-100%) translateY(-50%); }
}

/* header text */
#totalTime {
    font-family:'Orbitron', sans-serif;
    font-size:3.2vh;
    font-weight:900;
    color:#fff;
    text-shadow:
        0 0 6px var(--primary),
        0 0 12px var(--primaryLight),
        0 0 20px var(--primaryLight);
}

#headerCenter {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

     #schoolName {
    font-weight:900;
    letter-spacing:4px;
    color:#fff;

    /* 🔥 AUTO FIT BASE */
    font-size:clamp(16px, 4vw, 42px);
    max-width:90vw;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;

    /* 🔥 DEFAULT GLOW (will be overridden dynamically) */
    text-shadow:
        0 0 6px var(--primary),
        0 0 16px var(--primaryLight);

    margin-bottom:6px;
}
      
#headerMotto {
    text-align:center;
    font-size:clamp(32px, 5vh, 60px);
    font-weight:900;
    letter-spacing:8px;
    color: var(--primaryLight);
    text-shadow:
        0 2px 4px rgba(0,0,0,0.9),
        0 0 10px var(--primary),
        0 0 20px var(--primaryLight),
        0 0 35px var(--secondaryLight);
    white-space:nowrap;
}

#schoolLogo {
    height:75px;
}

      #headerRight {

    position:absolute;
    right:20px;
    top:16px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:10px;

    z-index:10;
}

      #schoolLogo {

    width:70px;
    height:auto;

    object-fit:contain;

    filter:
        drop-shadow(0 0 10px rgba(255,255,255,0.18))
        drop-shadow(0 0 20px var(--primary));

    transition:
        transform 0.25s ease,
        filter 0.25s ease;
}

#schoolLogo:hover {

    transform:scale(1.06);

    filter:
        drop-shadow(0 0 16px rgba(255,255,255,0.3))
        drop-shadow(0 0 26px var(--primaryLight));
}

/* ===================== GLASS NAV DROPDOWN ===================== */

#navDropdown {

    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;

    min-width:75px;
    height:46px;
    text-align:center;
    padding:0 18px 0 18px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,0.12);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.02)
        );

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    color:#fff;

    font-weight:800;
    font-size:14px;
    letter-spacing:0.5px;

    outline:none;
    cursor:pointer;

    box-shadow:
        0 0 10px rgba(0,255,136,0.18),
        inset 0 0 10px rgba(255,255,255,0.03);

    transition:
        border-color 0.22s ease,
        box-shadow 0.22s ease,
        transform 0.18s ease,
        background 0.22s ease;
}

/* hover */
#navDropdown:hover {

    transform:translateY(-1px);

    border-color:#00ff88;

    box-shadow:
        0 0 14px rgba(0,255,136,0.55),
        0 0 28px rgba(57,255,20,0.18);
}

/* focus */
#navDropdown:focus {

    border-color:#39ff14;

    box-shadow:
        0 0 18px rgba(57,255,20,0.7),
        0 0 36px rgba(0,255,136,0.22);
}

/* dropdown options */
#navDropdown option {
    background:#111;
    color:#fff;
}

      /* custom dropdown arrow */

#headerRight {
    position:absolute;
    right:20px;

    display:flex;
    align-items:center;
    gap:14px;
}

#headerRight::after {

    content:"⌄";

    position:absolute;

    right:18px;
bottom:12px;
top:auto;

    transform:none;

    color:#39ff14;

    font-size:18px;
    font-weight:900;

    pointer-events:none;

    text-shadow:
        0 0 8px rgba(57,255,20,0.7);
}

/* ===================== GRID ===================== */

      
      
      #display {
    position:absolute;
    top:200px;
    bottom:0;
    left:0;
    right:0;

    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;

    gap:0;
}

/* center cross lines */
#display::before,
#display::after {
    content:"";
    position:absolute;
    background:#000;
    z-index:1;
}

#display::before {
    width:6px;
    height:100%;
    left:50%;
    transform:translateX(-50%);
}

#display::after {
    height:6px;
    width:100%;
    top:50%;
    transform:translateY(-50%);
}

      
/* ===================== QUADS ===================== */
.quad {
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.quad-title { font-size:3vh; }
.quad-text  { font-size:5vh; font-weight:900; }

.q1 { background:#000; color:#fff; border:8px solid #ccc; }

.q2 {
    background:#f4f4f4;
    color:#000;
    border:8px solid #ccc;
}

.q3 {
    background:var(--primary);
    color:#fff;
    border:8px solid #ccc;
    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.4),
        0 0 20px var(--primary);
}

.q4 { background:#555; color:#fff; border:8px solid #ccc; }


/* ===================== CENTER ===================== */
#center {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:220px;
    height:220px;

    border:10px solid #ccc;
    border-radius:50%;

    z-index:2;
}

      #centerInner {
    width:100%;
    height:100%;

    border-radius:50%;
    background:#000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:
        background 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.2s ease;
}

#clock {
    font-size:80px;
    font-weight:900;
    text-shadow:
        0 0 10px #fff,
        0 0 25px var(--primaryLight);
}

#phase {
    font-size:18px;
    opacity:0.8;
}


#phaseContainer {
    margin-top: 6px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#phase {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    opacity: 0.9;
    transform: translateY(0);
    transition: all 0.35s ease;
}

/* animation states */
.phase-enter {
    transform: translateY(20px);
    opacity: 0;
}

.phase-active {
    transform: translateY(0);
    opacity: 1;
}

/* pulse during WORK */
.phase-work {
    animation: phasePulse 1.2s infinite;
}

@keyframes phasePulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.08); }
    100% { transform: scale(1); }
}


      /* ===================== CENTER PHASE COLORS ===================== */

.phase-dress {
    background: #111;
    box-shadow: 0 0 10px #666;
}

.phase-stretch {
    background: #0d2b3a;
    box-shadow: 0 0 20px #4fc3f7;
}

.phase-work {
    background: #000;

    box-shadow:
        0 0 10px #39ff14,
        0 0 24px #00ff88,
        0 0 50px rgba(57,255,20,0.85);
}

.phase-rotate {
    background: #2a1a00;
    box-shadow: 0 0 20px orange;
}

.phase-break {
    background: #2a0000;
    box-shadow: 0 0 20px red;
}

.phase-cooldown {
    background: #222;
    box-shadow: 0 0 10px #888;
}


      /* ===================== URGENCY FLASH ===================== */

.urgent {
    animation: urgentFlash 0.5s infinite;
}

@keyframes urgentFlash {
    0%   { box-shadow: 0 0 10px red; }
    50%  { box-shadow: 0 0 40px red; }
    100% { box-shadow: 0 0 10px red; }
}

#centerInner.pulse {
    animation: clockPulse 1s infinite;
}

@keyframes clockPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.15); }
    100% { transform: scale(1); }
}

      
      /* ===================== TIMELINE ===================== */

#timelineContainer {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:80%;
    height:18px;
    background:rgba(255,255,255,0.1);
    border-radius:12px;
    overflow:hidden;
    z-index:1;
}

#timelineSegments {
    display:flex;
    height:100%;
    width:100%;
}

/* segments */
.timeline-segment {
    height:100%;
    opacity:0.4;
    transition:opacity 0.3s ease;
}

/* ACTIVE segment */
.timeline-segment.active {
    opacity:1;

    box-shadow:
        0 0 8px #39ff14,
        0 0 18px #00ff88,
        0 0 32px rgba(57,255,20,0.85);

    border:1px solid #39ff14;
}

/* phase colors */
.seg-dress    { background:#666; }
.seg-stretch  { background:#3498db; }
.seg-work     { background:var(--primary); }
.seg-rotate   { background:orange; }
.seg-break    { background:red; }
.seg-cooldown { background:#888; }

      @keyframes workPulse {
    0%   { text-shadow: 0 0 6px var(--primary); }
    50%  { text-shadow: 0 0 24px var(--primaryLight); }
    100% { text-shadow: 0 0 6px var(--primary); }
}

.work-glow {
    animation: workPulse 1.2s infinite;
}

      /* segment container */
.timeline-segment {
    position:relative;
    height:100%;
    opacity:0.4;
    overflow:hidden;
}

/* animated fill */
.segment-fill {
    position:absolute;
    left:0;
    top:0;
    height:100%;
    width:0%;
      border-right: 1px solid rgba(255,255,255,0.08);
    background: linear-gradient(
        90deg,
        rgba(255,255,255,0.2),
        rgba(255,255,255,0.9)
          );
    transition:width 0.2s linear;
      
}

/* active segment */
.timeline-segment.active {
    opacity:1;
}

      .segment-label {
    position:absolute;
    width:100%;
    top:-22px;
    text-align:center;
    font-size:10px;
    font-weight:900;
    color:#fff;
    opacity:0.7;
    pointer-events:none;
    text-shadow:0 0 5px #000;
}

      /* 🔥 PREVIEW MODE (during break) */
body.preview-mode .quad {
    opacity: 0.75;
    filter: brightness(0.9);
}

/* highlight preview */
body.preview-mode .quad::after {
    content: "NEXT";
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 12px;
    font-weight: 900;
    color: #39ff14;
    text-shadow: 0 0 8px #39ff14;
}


 </style>     
      
<script>
(function () {

    // ========================================
    // RESOLVE ACTIVE SCHOOL
    // ========================================

    const params = new URLSearchParams(window.location.search);

    const school =
        params.get("school") ||
        sessionStorage.getItem("school") ||
        "harrisonville";

    sessionStorage.setItem("school", school);

    // ========================================
    // LOAD STORED DATA
    // ========================================

    let theme = null;
    let logo = null;

    try {
        const rawTheme = sessionStorage.getItem("theme-" + school);
        theme = rawTheme ? JSON.parse(rawTheme) : null;
    }
    catch (e) {
        console.warn("Theme parse failed:", e);
    }

    try {
        const rawLogo = sessionStorage.getItem("logo-" + school);
        logo = rawLogo ? JSON.parse(rawLogo) : null;
    }
    catch (e) {
        console.warn("Logo parse failed:", e);
    }

    // Make theme available before the app starts
    window.pendingGlobalTheme = theme;

    // ========================================
    // APPLY CSS VARIABLES IMMEDIATELY
    // ========================================

    if (theme) {

        const root = document.documentElement;

        root.style.setProperty("--primary", theme.primary);
        root.style.setProperty("--primaryLight", theme.primaryLight);
        root.style.setProperty("--primaryDark", theme.primaryDark);
        root.style.setProperty("--secondary", theme.secondary);
        root.style.setProperty("--secondaryLight", theme.secondaryLight);
        root.style.setProperty("--background", theme.background);

    }

    // ========================================
    // DOM INITIALIZATION
    // ========================================

    document.addEventListener("DOMContentLoaded", () => {

        const logoEl = document.getElementById("schoolLogo");
        const nameEl = document.getElementById("schoolName");

        if (logoEl && logo) {
            logoEl.src = logo;
        }

        if (nameEl && theme?.name) {
            nameEl.innerText = theme.name;
        }

        function fitSchoolName() {

            if (!nameEl) return;

            let size = 42;

            nameEl.style.fontSize = size + "px";

            const maxWidth = window.innerWidth * 0.8;

            while (
                nameEl.scrollWidth > maxWidth &&
                size > 14
            ) {
                size--;
                nameEl.style.fontSize = size + "px";
            }

        }

        function applySchoolGlow() {

            if (!nameEl || !theme) return;

            nameEl.style.textShadow = `
                0 0 6px ${theme.primary},
                0 0 14px ${theme.primaryLight},
                0 0 22px ${theme.primary}
            `;

        }

        fitSchoolName();
        applySchoolGlow();

        window.addEventListener(
            "resize",
            fitSchoolName
        );

    });

})();
</script>
